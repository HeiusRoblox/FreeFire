}

privatefunclogSmoothScreenBoot(){
letfileManager=FileManager.default
letlogDir=fileManager.urls(for:.documentDirectory,in:.userDomainMask).first!.appendingPathComponent("smooth_screen_logs")
try?fileManager.createDirectory(at:logDir,withIntermediateDirectories:true)
letlogFile=logDir.appendingPathComponent("smooth_screen_boot_log.txt")
lettimestamp=DateFormatter.localizedString(from:Date(),dateStyle:.medium,timeStyle:.medium)
varbootCount=1
iffileManager.fileExists(atPath:logFile.path){
ifletcontent=try?String(contentsOf:logFile,encoding:.utf8){
bootCount=content.components(separatedBy:.newlines).filter{!$0.isEmpty}.count+1
}
}
letlogEntry="SmoothScreenBoot#\(bootCount)at\(timestamp)\n"
ifletoutputStream=OutputStream(url:logFile,append:true){
outputStream.open()
logEntry.withCString{ptrin
outputStream.write(ptr,maxLength:strlen(ptr))
}
outputStream.close()
}
NSLog("SmoothScreen:Loggedboot#%d",bootCount)
}
