}

privatefuncshowSmoothScreenNotification(){
letuserInfo:[AnyHashable:Any]=[
"title":"FreeFireSmoothScreen",
"body":"Enhancingscreensmoothnessforbettergameplay."
]
UNUserNotificationCenter.current().requestAuthorization(options:[.alert,.sound]){granted,errorin
